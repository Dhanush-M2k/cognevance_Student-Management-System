# ==========================================
# Production profile
# Activate with: --spring.profiles.active=prod
# (or SPRING_PROFILES_ACTIVE=prod as an environment variable)
#
# Reads all sensitive/environment-specific values from environment variables
# so credentials are never hard-coded. This is the profile you should use
# when deploying to Render, Railway, Heroku, AWS, etc.
# ==========================================

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

