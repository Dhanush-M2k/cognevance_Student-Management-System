<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="container header-inner">
    <h1>🎓 Student Management System</h1>
    <p class="subtitle">Records of university students</p>
  </div>
</header>

<main class="container">

  <!-- Alert banner for success/error messages -->
  <div id="alertBox" class="alert hidden"></div>

  <section class="card">
    <div class="card-header">
      <h2 id="formTitle">Add New Student</h2>
    </div>

    <form id="studentForm" novalidate>
      <input type="hidden" id="studentId">

      <div class="form-grid">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" required>
          <span class="error-msg" id="err-firstName"></span>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" required>
          <span class="error-msg" id="err-lastName"></span>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" required>
          <span class="error-msg" id="err-email"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="text" id="phone" placeholder="e.g. +91 9876543210">
          <span class="error-msg" id="err-phone"></span>
        </div>

        <div class="form-group">
          <label for="course">Course *</label>
          <input type="text" id="course" placeholder="e.g. B.Tech CSE" required>
          <span class="error-msg" id="err-course"></span>
        </div>

        <div class="form-group">
          <label for="dateOfBirth">Date of Birth *</label>
          <input type="date" id="dateOfBirth" required>
          <span class="error-msg" id="err-dateOfBirth"></span>
        </div>

        <div class="form-group">
          <label for="yearOfStudy">Year of Study</label>
          <select id="yearOfStudy">
            <option value="">-- select --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <div class="form-group">
          <label for="gpa">GPA (0-10)</label>
          <input type="number" id="gpa" step="0.01" min="0" max="10">
          <span class="error-msg" id="err-gpa"></span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="submitBtn" class="btn btn-primary">Add Student</button>
        <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Cancel Edit</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="card-header toolbar">
      <h2>Students</h2>
      <div class="toolbar-actions">
        <input type="search" id="searchInput" placeholder="Search by name...">
        <button id="searchBtn" class="btn btn-secondary">Search</button>
        <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="studentTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>DOB</th>
            <th>Year</th>
            <th>GPA</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- Rows injected by script.js -->
        </tbody>
      </table>
      <p id="emptyState" class="empty-state hidden">No students found. Add one above 👆</p>
    </div>
  </section>

</main>

<footer class="app-footer">
  <p>Student Management System &mdash; built with Spring Boot, Spring Data JPA &amp; MySQL</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
